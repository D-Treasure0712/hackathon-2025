name: Deploy to ConoHa VPS

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたら動く

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          timeout: 30m
          script: |
            # 1. フォルダがなければClone、あればPull
            # ※ <ユーザー名>/<リポジトリ名> はあなたのものに書き換えてください！
            if [ ! -d "/root/shogi-app/.git" ]; then
              git clone https://github.com/D-Treasure0712/hackathon-2025.git /root/shogi-app
            else
              cd /root/shogi-app
              git pull origin main
            fi

            # 2. Docker起動 (ビルド込み)
            cd /root/shogi-app
            docker compose up -d --build
            
            # 3. お掃除 (古いイメージを消す)
            docker image prune -f