services:
  # フロントエンド (Next.js)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # マウント後に依存を再インストールしてモジュール欠落を防ぐ（ここを追加してちょ）
    command: sh -c "npm install && npm run dev"
    environment:
      - WATCHPACK_POLLING=true # Windowsでのホットリロード対応
    tty: true # コンテナを維持させる
  # バックエンド (Go)
  backend:
    build:
      context: ./backend
    platform: linux/amd64
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./backend:/app
      - ./AI/eval:/AI/eval # 評価関数
      - ./AI/book:/AI/book # 定石ファイル
